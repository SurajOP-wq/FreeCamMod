name: Build LeviPack Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        id: setup-ndk
        uses: android-actions/setup-ndk@v3
        with:
          ndk-version: r25c

      - name: Compile ARM64 Native Library
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-28 ..
          make

      - name: Create .levipack Package
        run: |
          mkdir -p dist/lib/arm64-v8a
          cp build/libfreecam.so dist/lib/arm64-v8a/
          cp manifest.json dist/
          cd dist && zip -r ../Freecam_1.26.40.5.levipack .

      - name: Upload Finished Mod
        uses: actions/upload-artifact@v4
        with:
          name: Freecam-LeviPack-1.26.40.5
          path: Freecam_1.26.40.5.levipack
